name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.14"]
        test-category: ["unit", "e2e"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv venv --python ${{ matrix.python-version }}
        uv sync --frozen --group test

    - name: Install Helm
      uses: azure/setup-helm@v5
      with:
        version: 'latest'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install kubectl
      uses: azure/setup-kubectl@v5
      with:
        version: 'latest'

    - name: Run tests based on matrix
      run: |
        source .venv/bin/activate
        case "${{ matrix.test-category }}" in
          "unit")
            pytest -v tests/unit/ tests/test_imports.py --cov=sbkube --cov-report=xml --cov-report=html
            ;;
          "e2e")
            pytest -v tests/e2e/ -m e2e --cov=sbkube --cov-report=xml --cov-report=html
            ;;
        esac
      continue-on-error: false

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      if: hashFiles('coverage.xml') != ''
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.test-category }}

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always() && hashFiles('coverage.xml') != ''
      with:
        name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.test-category }}
        path: |
          htmlcov/
          coverage.xml
          .coverage
        if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv venv --python 3.14
        uv sync --frozen --group dev

    - name: Run ruff
      run: |
        source .venv/bin/activate
        ruff check sbkube tests

    - name: Run mypy
      run: |
        source .venv/bin/activate
        mypy sbkube

  validate-examples:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install sbkube
      run: |
        uv venv --python 3.14
        uv pip install -e .

    - name: Validate example configs
      run: |
        source .venv/bin/activate

        # examples 디렉토리에서 config.yaml 찾기
        for config in $(find examples -name "config.yaml" -o -name "config-*.yaml"); do
          echo "Validating: $config"
          sbkube validate "$config" || echo "⚠️ Validation warning for $config"
        done

    - name: Check example READMEs
      run: |
        # README.md 누락 확인
        missing_readmes=0
        for dir in examples/*/; do
          if [ ! -f "${dir}README.md" ]; then
            echo "❌ Missing README.md in: $dir"
            missing_readmes=$((missing_readmes + 1))
          fi
        done

        if [ $missing_readmes -gt 0 ]; then
          echo "⚠️ Found $missing_readmes directories without README.md"
        else
          echo "✅ All example directories have README.md"
        fi
